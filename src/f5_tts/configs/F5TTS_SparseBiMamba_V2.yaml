# ============================================================
#  F5TTS_SparseBiMamba_V2  —  FINAL HYBRID DESIGN
# ============================================================
#
#  Architecture: Sparse Mamba placement at layers [6, 10, 14, 18]
#                with zero-init mamba_alpha gating.
#
#  Training: Teacher-Student Distillation from F5-TTS Base.
# ============================================================

hydra:
  run:
    dir: ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

datasets:
  name: tts_indo_merged
  batch_size_per_gpu: 38400
  batch_size_type: frame
  max_samples: 64
  num_workers: 16

optim:
  epochs: 100
  learning_rate: 1.0e-4
  num_warmup_updates: 5000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: True  # 8-bit AdamW

model:
  name: F5TTS_SparseBiMamba_V2
  tokenizer: pinyin
  tokenizer_path: null
  backbone: HybridDiT
  arch:
    dim: 1024
    depth: 22
    heads: 16
    ff_mult: 2
    text_dim: 512
    text_mask_padding: False
    conv_layers: 4
    pe_attn_head: 1
    attn_backend: torch
    attn_mask_enabled: False
    checkpoint_activations: True

    use_mamba: true
    mamba_layers: [6, 10, 14, 18]
    use_bidi: true
    inject_sinpos: true
    mamba_d_state: 64
    mamba_d_conv: 4
    mamba_expand: 2
    capture_hidden_for_distill: true

  cfm_experiment:
    use_distill: true
    lambda_distill_out: 1.0
    lambda_distill_hidden: 1.0
    distill_hidden_layers: [5, 9, 13, 17, 21]
    use_ctc: false
    use_accent_adv: false

  mel_spec:
    target_sample_rate: 24000
    n_mel_channels: 100
    hop_length: 256
    win_length: 1024
    n_fft: 1024
    mel_spec_type: vocos

  vocoder:
    is_local: False
    local_path: null

ckpts:
  logger: wandb
  wandb_project: Hybrid-Mamba-TTS
  wandb_run_name: ${model.name}_Sparse_Distill
  wandb_resume_id: null
  log_samples: True
  save_per_updates: 2000
  keep_last_n_checkpoints: 5
  last_per_updates: 500
  save_dir: ckpts/${model.name}
